[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-job-search-assistant"
version = "0.1.0"
description = "Open-source AI job-search assistant: crawls job sources, maintains a SQLite tracker, tailors resumes truthfully, and never submits an application for you."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "pyyaml>=6.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
prefill = ["playwright>=1.44"]

[project.scripts]
jobhunt = "jobhunt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
